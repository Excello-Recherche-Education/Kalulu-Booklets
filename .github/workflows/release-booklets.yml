name: Release Booklets

# Builds the booklets of every language pack and publishes them, all in one
# GitHub release, as one zip per language: Kalulu-Booklets-<locale>.zip holds a
# folder of that language's PDFs, a subfolder per version (base, teacher,
# no-writing, dyslexia, dyspraxia, adhd: BookletVersion), as the generator writes
# them, and its build notes. The generator is the Godot project, project/, run
# from the command line (project/cli/build_command.gd).
# Run by hand: Actions -> Release Booklets -> Run workflow.
#
# The booklets are never committed (build/ is ignored): this release is where
# they are downloaded from. Nothing is published unless every pack builds, so a
# release always holds every language.

on:
  workflow_dispatch:
    inputs:
      languages_ref:
        description: >-
          Kalulu-Languages branch, tag or commit to build from. Empty: the
          commit kalulu-languages/ is pinned to in this repository.
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release instead of Latest"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7-stable
      GODOT_BIN: godot/Godot_v4.7-stable_linux.x86_64
      # Matches project/addons/godot-sqlite/plugin.cfg.
      SQLITE_VERSION: v4.7
      # The packs' media (~1.3 GB) are in Git LFS, and the booklets need only
      # the Look & Learn and booklet images (the teacher's pages), fetched below:
      # language.db is a plain file, and fonts/ is Kalulu-Languages' own
      # submodule, Kalulu-Fonts.
      GIT_LFS_SKIP_SMUDGE: "1"

    steps:
      - name: Check out the generator and the pinned language packs
        uses: actions/checkout@v5
        with:
          # recursive: the fonts are kalulu-languages/fonts, a submodule of it.
          submodules: recursive
          lfs: false

      - name: Move the language packs to the requested ref
        if: inputs.languages_ref != ''
        env:
          REF: ${{ inputs.languages_ref }}
        run: |
          git -C kalulu-languages fetch --quiet origin "$REF"
          git -C kalulu-languages checkout --quiet --detach FETCH_HEAD
          git -C kalulu-languages submodule update --quiet --init

      - name: Fetch the Look & Learn and booklet images
        run: git -C kalulu-languages lfs pull --include "*/look_and_learn/images/*,*/booklet_images/*"

      - name: Download Godot
        run: |
          GODOT_ZIP=Godot_v${GODOT_VERSION}_linux.x86_64.zip
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          unzip -q godot.zip -d godot
          chmod +x "${GODOT_BIN}"

      # The godot-sqlite libraries are in no repository; the generator reads
      # language.db with them.
      - name: Download godot-sqlite
        run: |
          curl -sSL -o sqlite-bin.zip \
            "https://github.com/2shady4u/godot-sqlite/releases/download/${SQLITE_VERSION}/bin.zip"
          unzip -q -o sqlite-bin.zip 'bin/libgdsqlite.linux.template_debug.x86_64.so' -d project/addons/godot-sqlite/
          test -f project/addons/godot-sqlite/bin/libgdsqlite.linux.template_debug.x86_64.so

      - name: Import the project
        run: |
          "${GODOT_BIN}" --headless --path project --import

      - name: Run the tests
        # GUT exits non-zero when a test fails.
        run: |
          "${GODOT_BIN}" --headless --path project -s res://addons/gut/gut_cmdln.gd -gexit

      - name: Build every language's booklets
        id: build
        run: |
          mkdir -p dist build
          locales=""
          failed=""
          # Every locale folder (xx_XX) with a language.db: fonts/ and schema/
          # are not packs.
          for pack in kalulu-languages/*/; do
            locale="$(basename "$pack")"
            [[ "$locale" =~ ^[a-z]{2}_[A-Z]{2}$ && -f "$pack/language.db" ]] || continue
            locales="$locales $locale"
            echo "::group::$locale"
            # Relative paths are taken from here ($PWD), and printed as given.
            # Godot's own messages at exit go to stderr, kept apart from the notes.
            "${GODOT_BIN}" --headless --no-header --path project -- build "kalulu-languages/$locale" --out build \
              > "build/$locale.log" 2> "build/$locale.err" || failed="$failed $locale"
            cat "build/$locale.log" "build/$locale.err"
            echo "::endgroup::"
          done
          if [[ -z "$locales" ]]; then
            echo "::error::no language pack found in kalulu-languages/"
            exit 1
          fi
          if [[ -n "$failed" ]]; then
            echo "::error::the booklets of$failed could not be built; nothing is published"
            exit 1
          fi
          # A release lists its files flat, so each language is one zip, with a
          # folder inside: everything the generator wrote for it, plus its notes.
          mkdir -p stage
          for locale in $locales; do
            folder="Kalulu-Booklets-$locale"
            mkdir -p "stage/$folder"
            cp -R "build/$locale/." "stage/$folder/"
            cp "build/$locale.log" "stage/$folder/build-notes.txt"
            (cd stage && zip -q -r -X "../dist/$folder.zip" "$folder")
          done
          echo "locales=${locales# }" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        id: notes
        env:
          LOCALES: ${{ steps.build.outputs.locales }}
          LANGUAGES_REF: ${{ inputs.languages_ref }}
        run: |
          languages_commit="$(git -C kalulu-languages rev-parse HEAD)"
          tag="booklets-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "The Kalulu reading booklets of every language pack, as PDF, A5 (148 × 210 mm): one zip per language."
            echo
            echo "Each zip holds a folder per version: \`base\`, \`teacher\` (a page with the chapter's picture before each chapter, under the same page number) \`no-writing\` (without the writing pages), and the three adapted ones, \`dyslexia\`, \`dyspraxia\` and \`adhd\` (bigger and airier text, a chapter over several pages; dyspraxia and adhd colour the multi-letter graphemes). A language printing a script and a cursive series (\`pt_BR\`) has both in each folder, as \`-script\` and \`-cursive\` files, and a language prints only the versions its pack asks for. The \`-print\` files are the same booklets on A4 sheets, two pages a side, in the order a folded and stapled booklet reads them."
            echo
            echo "| Language | Download | Booklets | Pages |"
            echo "|---|---|---|---|"
            for locale in $LOCALES; do
              count="$(find "stage/Kalulu-Booklets-$locale/base" -name '*.pdf' ! -name '*-print.pdf' | wc -l | tr -d ' ')"
              pages="$(grep '/base/' "build/$locale.log" | grep -oE '\(([0-9]+) pages' | grep -oE '[0-9]+' | paste -sd ' ' -)"
              echo "| \`$locale\` | \`Kalulu-Booklets-$locale.zip\` | $count | $pages |"
            done
            echo
            echo "Built from:"
            echo
            echo "- the generator at ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
            if [[ -n "$LANGUAGES_REF" ]]; then
              echo "- Kalulu-Languages \`$LANGUAGES_REF\`, ${languages_commit::8}"
            else
              echo "- Kalulu-Languages ${languages_commit::8}, the commit this repository pins"
            fi
            echo
            echo "What could not be printed as a pack asks (a word wider than its cell, sentences that do not fit, a letter a font lacks…) is listed in each zip's \`build-notes.txt\`."
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then flags=(--prerelease --latest=false); else flags=(--latest); fi
          gh release create "$TAG" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Kalulu Booklets $(date -u +%Y-%m-%d)" \
            --notes-file release-notes.md \
            "${flags[@]}"
